<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e1b;color:#eaf3ff;font-family:Arial}
#view{width:100%;height:100%;display:block}
#hint{position:absolute;top:10px;left:10px;padding:7px 10px;background:#111d31dd;border:1px solid #28415f;border-radius:8px;font-size:11px}
#error{position:absolute;bottom:10px;left:10px;right:10px;color:#ffb4a8;font-size:11px}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hint">CENA 3D • arraste para girar • pinça para zoom</div>
<canvas id="view"></canvas><div id="error"></div><style>
#toolbar{position:absolute;top:48px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;z-index:5}
#toolbar button,#command button{background:#142944;color:#eaf3ff;border:1px solid #365779;border-radius:9px;padding:9px 12px;font-weight:600}
#command{position:absolute;left:10px;right:10px;bottom:14px;display:flex;gap:7px;z-index:5}
#command input{min-width:0;flex:1;background:#101d30;color:#fff;border:1px solid #365779;border-radius:9px;padding:12px;font-size:14px}
#status{position:absolute;left:10px;right:10px;bottom:68px;z-index:5;background:#101d30dd;border:1px solid #28415f;border-radius:8px;padding:8px;font-size:12px;pointer-events:none}
@media(min-width:700px){#toolbar{right:auto;width:180px;flex-direction:column}#command{left:auto;width:420px}}
</style>
<div id="toolbar">
<button onclick="mobileStudioCommand('part:cube')">＋ Bloco</button>
<button onclick="mobileStudioCommand('part:sphere')">＋ Esfera</button>
<button onclick="mobileStudioCommand('part:cylinder')">＋ Cilindro</button>
<button onclick="mobileStudioCommand('part:floor')">＋ Piso</button>
<button onclick="mobileStudioCommand('part:wall')">＋ Parede</button>
<button onclick="mobileStudioCommand('ai:crie um labirinto pequeno')">Labirinto</button>
<button onclick="mobileStudioCommand('ai:crie uma casa')">Casa</button>
</div>
<div id="status">Editor 3D pronto. Arraste para girar e use os botões para construir.</div>
<div id="command"><input id="prompt" placeholder="Descreva o que construir..."><button id="build">Construir</button></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const canvas=document.getElementById('view');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x080e1b);
scene.fog=new THREE.Fog(0x080e1b,90,260);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);
camera.position.set(38,34,48);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,0,0); controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xbad8ff,0x283044,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(30,60,25); sun.castShadow=true; scene.add(sun);
const grid=new THREE.GridHelper(200,40,0x31506f,0x1a2b40); grid.position.y=-.02; scene.add(grid);
const objects=[]; let selected=null; let serial=0;
const mats={cube:0x7297bd,sphere:0x42b9c9,cylinder:0xc59b63,wall:0x77808d,floor:0x34465d};
function addObject(kind,x=0,y=1,z=0){
 let geo;
 if(kind==='sphere') geo=new THREE.SphereGeometry(1,24,16);
 else if(kind==='cylinder') geo=new THREE.CylinderGeometry(1,1,2,24);
 else geo=new THREE.BoxGeometry(kind==='floor'?12:2,kind==='floor'?.3:2,kind==='floor'?12:2);
 const mat=new THREE.MeshStandardMaterial({color:mats[kind]||mats.cube,roughness:.78});
 const mesh=new THREE.Mesh(geo,mat); mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true;
 mesh.name=(kind==='floor'?'Piso':kind==='wall'?'Parede':kind==='sphere'?'Esfera':kind==='cylinder'?'Cilindro':'Bloco')+'_'+(++serial);
 scene.add(mesh); objects.push(mesh); updateTree(); return mesh;
}
function updateTree(){if(window.AndroidStudio)AndroidStudio.selected('Workspace ('+objects.length+' peças)');}
function clearScene(){for(const o of [...objects]){scene.remove(o);o.geometry.dispose();o.material.dispose()}objects.length=0;selected=null;serial=0}
function makeMaze(size=13){
 clearScene(); const step=4, half=Math.floor(size/2);
 addObject('floor',0,-.2,0).scale.set(size*2,.2,size*2);
 for(let z=-half;z<=half;z++)for(let x=-half;x<=half;x++){
  const border=Math.abs(x)===half||Math.abs(z)===half;
  const lane=(x%4===0&&z%4!==1)||(z%5===0&&x%4!==1);
  if(border||lane){const w=addObject('wall',x*step,1,z*step);w.scale.set(1,1.8,1);}
 }
 const spawn=addObject('cube',-half*step+3,1,-half*step+3);spawn.material.color.setHex(0x48d597);spawn.name='Entrada';
 const goal=addObject('sphere',half*step-3,1,half*step-3);goal.material.color.setHex(0xffc857);goal.name='Saida';
 camera.position.set(size*2.4,size*2.1,size*2.8);controls.target.set(0,0,0);controls.update();
 report('Labirinto criado na cena 3D: '+objects.length+' objetos. Arraste para explorar.');
}
function report(s){document.getElementById('status').textContent=s;if(window.AndroidStudio)AndroidStudio.report(s)}
window.mobileStudioCommand=function(command){
 document.getElementById('status').textContent='Processando: '+command;
 try{
  if(command.startsWith('part:')){const kind=command.split(':')[1];addObject(kind,Math.round((Math.random()-.5)*12),1,Math.round((Math.random()-.5)*12));report('Peça adicionada: '+kind+'. Total: '+objects.length);return}
  if(command.startsWith('ai:')){
   const p=command.slice(3).toLowerCase();
   if(p.includes('labirinto')||p.includes('maze')){makeMaze(p.includes('pequeno')?9:p.includes('gigante')?21:13);return}
   if(p.includes('casa')){clearScene();addObject('floor',0,-.2,0);for(let x=-3;x<=3;x+=6){let a=addObject('wall',x,2,0);a.scale.set(.3,2,6)}for(let z=-3;z<=3;z+=6){let a=addObject('wall',0,2,z);a.scale.set(6,.3,.3)}let roof=addObject('cube',0,4,0);roof.scale.set(7,.3,7);report('Casa-base criada. Você pode continuar adicionando peças.');return}
   report('Ainda não reconheço esse pedido. Por enquanto, experimente: “crie um labirinto pequeno”, “crie um labirinto gigante” ou “crie uma casa”.');
  }
 }catch(e){report('Erro na construção: '+e.message)}
};
document.getElementById('build').addEventListener('click',()=>{const v=document.getElementById('prompt').value.trim();if(v)window.mobileStudioCommand('ai:'+v)});document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('build').click()});
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{const r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(objects)[0];if(hit){if(selected)selected.material.emissive?.setHex(0x000000);selected=hit.object;if(selected.material.emissive)selected.material.emissive.setHex(0x17466a);report('Selecionado: '+selected.name+' | posição '+selected.position.x.toFixed(1)+', '+selected.position.y.toFixed(1)+', '+selected.position.z.toFixed(1));if(window.AndroidStudio)AndroidStudio.selected('Workspace  ›  '+selected.name)}});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
addObject('floor',0,-.2,0);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
