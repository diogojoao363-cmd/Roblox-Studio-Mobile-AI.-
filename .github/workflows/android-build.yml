name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk Roblox-Studio-Mobile-AI.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Studio-Mobile-AI-debug
          path: Roblox-Studio-Mobile-AI.apk
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="mobile-ai-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Roblox Studio Mobile AI - APK" --notes "APK de depuração mais recente. Baixe Roblox-Studio-Mobile-AI.apk e instale no Android."
          fi
          gh release upload "$TAG" Roblox-Studio-Mobile-AI.apk --clobber
